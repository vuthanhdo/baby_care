<!DOCTYPE html><html lang="vi"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splash Screen – Bé Khỏe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F7F9F8;
      color: #172D32;
    }
    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.92; }
    }
    .animate-pulse-soft {
      animation: pulse-soft 3s ease-in-out infinite;
    }
    @keyframes spin-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 2s linear infinite;
    }
  </style>
</head>
<body class="bg-[#F7F9F8] min-h-screen flex flex-col justify-between items-center text-[#172D32] relative overflow-hidden select-none">

  <!-- Background Subtle Ambient Glows -->
  <div class="absolute -top-24 -left-20 w-80 h-80 rounded-full bg-[#E2F7FD] opacity-70 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -right-16 w-80 h-80 rounded-full bg-[#EBF7F5] opacity-80 blur-3xl pointer-events-none"></div>

  <!-- Top safe area spacer -->
  <div class="w-full pt-16"></div>

  <!-- Center Branding Unit -->
  <div class="flex flex-col items-center justify-center px-6 text-center z-10 my-auto">
    
    <!-- App Icon Emblem -->
    <div class="relative mb-6 flex items-center justify-center"><div class="w-32 h-32 rounded-[36px] bg-gradient-to-tr from-[#146C60]/15 via-[#146C60]/5 to-transparent flex items-center justify-center animate-pulse-soft"><img src="https://lh3.googleusercontent.com/aida/AEtjO1Uw8jRtJpJgTVQgLADcrkIJYXlhniaxQnq83EJgHw63fa6HBqIzrdWO7QVo68uXl_Rzx30KwGK-DK-qfVFoAZVbTcsO5fj66iwtWcPEhTjB7oWwAhSYOcl_r7p-7jy28u32mHnUjAJdnCmeSCTL3RJD7Qw283iYOpdHHRHQsqg8DjP-uMpk0Qox-In8ENkW9INCupltSZeyhDZ1ulVu9syUkvd9aHz8RIqLld13b2-qN6CJ8HaeTuxnVDQ" alt="Bé Khỏe Logo" class="w-24 h-24 rounded-[26px] object-cover shadow-lg shadow-[#146C60]/25 border border-white/60"></div></div>

    <!-- App Name -->
    <h1 class="text-3xl font-extrabold tracking-tight text-[#172D32] mb-2 flex items-center justify-center gap-1.5">
      Bé Khỏe
    </h1>

    <!-- Slogan / Subtitle -->
    <p class="text-base font-semibold text-[#146C60] tracking-wide mb-1">
      Bố Mẹ An Tâm
    </p>

    <!-- Value proposition description -->
    <p class="text-xs text-[#52666B] max-w-[240px] leading-relaxed mt-1 font-normal">
      Ghi nhanh nhật ký · Theo dõi sát sao · Đồng hành trọn vẹn cùng bé yêu
    </p>

  </div>

  <!-- Bottom Indicator & Trust Badge -->
  <div class="w-full pb-12 flex flex-col items-center z-10 px-6">
    
    <!-- iOS Style Loading Spinner -->
    <div class="flex items-center gap-2 mb-6 text-xs text-[#52666B] font-medium">
      <svg class="animate-spin h-4 w-4 text-[#146C60]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span class="">Đang chuẩn bị dữ liệu...</span>
    </div>

    <!-- Security & Medical Quality Badge -->
    <div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white border border-slate-200/80 shadow-xs">
      <svg class="w-3.5 h-3.5 text-[#146C60]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
      </svg>
      <span class="text-[11px] font-medium text-[#52666B]">
        Tiêu chuẩn an toàn dữ liệu gia đình &amp; y tế
      </span>
    </div>

    <!-- Version tag -->
    <span class="text-[10px] text-slate-400 mt-2 font-medium">Phiên bản 1.2.0</span>

  </div>




</body></html>
