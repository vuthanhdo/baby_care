<!doctype html>
<html lang="vi">
<body style="font-family:Arial,sans-serif;color:#263B34;line-height:1.6;padding:24px">
  <h2>Xác minh email Bé Khỏe</h2>
  <p>Nhập mã dưới đây trong ứng dụng để hoàn tất đăng ký:</p>
  <p style="font-size:32px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
  <p>Không chia sẻ mã này với người khác. Nếu mã hết hạn, chọn “Gửi lại mã” trong ứng dụng.</p>
  <p>Nếu bạn không yêu cầu đăng ký, hãy bỏ qua email này.</p>
</body>
</html>
